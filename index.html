<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ES Project Dashboard</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1b2430;--mu:#5d6b7b;--ac:#0b5cab;--bd:#d9dee5;--r:#c0392b;--a:#b9770e;--g:#1d7a46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--cd:#1b222b;--tx:#e8edf3;--mu:#9aa8b8;--ac:#6db3f2;--bd:#303a46;--r:#ff7b6b;--a:#f0b35a;--g:#5fcf8f}}
:root[data-theme="dark"]{--bg:#12171d;--cd:#1b222b;--tx:#e8edf3;--mu:#9aa8b8;--ac:#6db3f2;--bd:#303a46;--r:#ff7b6b;--a:#f0b35a;--g:#5fcf8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--cd);border-bottom:1px solid var(--bd);padding:10px 16px}
header b{font-size:17px}header span{color:var(--mu);font-size:13px;margin-left:8px}
.lay{display:flex;max-width:1280px;margin:0 auto}
nav{width:250px;flex:none;display:flex;flex-direction:column;gap:2px;padding:14px 10px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto}
.lay nav a{display:block;border-radius:6px;border-color:transparent;padding:7px 10px}
.gl{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px 10px;border-top:1px solid var(--bd);padding-top:10px}
.chips{display:none}
@media(max-width:760px){.lay{flex-direction:column}nav{width:auto;position:static;max-height:none}}
nav a,.chips a{padding:6px 12px;border-radius:16px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:14px;cursor:pointer}
nav a.on,.chips a.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.chips{display:none}.chips a{font-size:13px;padding:4px 10px}
.lay nav a.sub{margin-left:16px}.tg{cursor:pointer;user-select:none}.tg:hover{color:var(--tx)}.gs{color:var(--mu);font-size:13px;font-weight:600;margin:6px 0 0 10px}
.nd{display:inline-block;min-width:150px;max-width:190px;vertical-align:top}
.av{width:78px;height:78px;border-radius:50%;border:4px solid #d62828;margin:0 auto -12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#d62828;overflow:hidden;cursor:pointer;position:relative;z-index:1}
.av img{width:100%;height:100%;object-fit:cover}
.lb{background:#d62828;color:#fff;font-weight:700;font-size:12px;padding:14px 8px 5px;border-radius:4px 4px 0 0;line-height:1.25}
.nm{background:var(--cd);border:1px solid var(--bd);font-size:12px;padding:3px 6px;border-radius:0 0 4px 4px;color:var(--mu)}
.banner{text-align:center;margin-bottom:12px}.banner b{display:block;background:#d62828;color:#fff;letter-spacing:.08em;padding:8px;border-radius:4px;max-width:420px;margin:4px auto 0}
.oct{padding-bottom:6px}.oct ul{padding:20px 0 0;position:relative;display:flex;justify-content:center;list-style:none;margin:0}.oct>ul{padding-top:0}
.oct li{position:relative;padding:20px 8px 0;text-align:center;list-style:none}.oct>ul>li{padding-top:0}
.oct li::before,.oct li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid #d62828;width:50%;height:20px}
.oct li::after{right:auto;left:50%;border-left:2px solid #d62828}
.oct li:only-child::after,.oct li:only-child::before,.oct>ul>li::before,.oct>ul>li::after{display:none}.oct li:only-child{padding-top:20px}
.oct li:first-child::before,.oct li:last-child::after{border:0 none}
.oct li:last-child::before{border-right:2px solid #d62828;border-radius:0 6px 0 0}.oct li:first-child::after{border-radius:6px 0 0 0}
.oct ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid #d62828;height:20px}
main{flex:1;min-width:0;padding:16px}
h2{font-size:17px;margin:0 0 8px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:13px;margin:8px 0 4px}
input,textarea,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:200px}
button{background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}button:disabled{opacity:.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);white-space:nowrap}
.m{color:var(--mu);font-size:13px}.w{color:var(--a)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.grid a{display:block;padding:12px;border:1px solid var(--bd);border-radius:8px;color:var(--tx);text-decoration:none;background:var(--cd)}
.big{font-size:26px;font-weight:700}ul.t,ul.t ul{list-style:none;padding-left:18px;border-left:2px solid var(--bd);margin:4px 0}ul.t{border:0;padding:0}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px;min-height:60px;font:13px/1.5 ui-monospace,Menlo,monospace}

.srcb{display:inline-block;background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px}.src{text-align:right}.src .m{margin-top:3px;max-width:340px}
.hl b{display:block}.un{display:block;border:0;border-bottom:1px dashed var(--bd);background:transparent;color:var(--mu);font-size:13px;padding:2px 0;width:240px;border-radius:0}.un:focus{outline:none;border-bottom-color:var(--ac);color:var(--tx)}
.sb{width:250px;flex:none;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto}.sb nav{width:auto;position:static;max-height:none;overflow:visible;padding-top:6px}
.qs{position:relative;padding:12px 10px 0}.qs input{width:100%}
#qr{position:absolute;left:10px;top:52px;width:min(480px,92vw);max-height:70vh;overflow:auto;background:var(--cd);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:30;padding:6px}
#qr .qh{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:8px 6px 2px}#qr .qi{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px}#qr .qi:hover{background:var(--bg)}#qr .qi small{display:block;color:var(--mu)}
@media(max-width:760px){.sb{width:auto;position:static;max-height:none}}
#spl{position:fixed;inset:0;z-index:3000;background:#fff;color:#1c2a35;display:flex;align-items:center;justify-content:center;transition:opacity .3s}#spl.out{opacity:0;pointer-events:none}
.spw{position:absolute;inset:0;background:var(--emb) center 50%/min(80vw,860px) no-repeat;opacity:.1}.spc{position:relative;text-align:center;padding:16px}
.spt{font-weight:800;letter-spacing:.12em;font-size:clamp(18px,3.4vw,30px);margin-bottom:26px}
.spi{display:flex;gap:clamp(8px,2vw,22px);justify-content:center;align-items:center;flex-wrap:wrap}
.spi img{width:clamp(56px,11vw,112px);height:auto;opacity:.12;transform:scale(.8);animation:spf .75s ease-out forwards}
@keyframes spf{0%{opacity:.12;transform:scale(.8)}30%{opacity:1;transform:scale(1.28);filter:drop-shadow(0 0 16px #0a9fb5)}100%{opacity:.88;transform:scale(1);filter:none}}
.spj{margin-top:30px;font-weight:700;font-size:clamp(16px,2.6vw,24px);color:#0a8aa0;letter-spacing:.06em;opacity:0;animation:spj 1s ease-out 3.9s forwards}
@keyframes spj{0%{opacity:0;transform:scale(.85)}35%{opacity:1;transform:scale(1.12);text-shadow:0 0 14px rgba(10,159,181,.7)}100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.spi img{animation-duration:.01s}.spj{animation-duration:.01s}}
#lk{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;align-items:center;justify-content:center}#lk[hidden]{display:none}
.lkb{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:22px;width:min(380px,92vw);text-align:center}.lkb input{margin-top:8px}
.lkl{width:96px;height:68px;margin:0 auto 10px;background:#fff var(--logo) center/contain no-repeat;border-radius:6px;border:1px solid var(--bd)}
#tk{flex-basis:100%;overflow:hidden;white-space:nowrap;border-top:1px solid var(--bd);margin-top:8px;padding:6px 0;font-size:13px;color:var(--tx)}
.tkt{display:inline-flex;animation:tkm 55s linear infinite}.tkt span{padding:0 26px;border-right:1px solid var(--bd)}#tk:hover .tkt{animation-play-state:paused}
@keyframes tkm{from{transform:translateX(-50%)}to{transform:translateX(0)}}

const DEF2="Engineering Manager | | \nAssociate Engineering Manager | | Engineering Manager\nEngineering Project Officer | | Associate Engineering Manager\nSenior Engineering Technologist | | Engineering Project Officer\nEngineering Technologist | | Senior Engineering Technologist";

const UPL=['daily','insp','test','siteinst','corr','defic','remw','ccc','accept'];const NP=()=>lg('es_nav',{});
const NI=(x,h,s)=>`<a href='#${x[0]}' class='${x[0]===h?'on':''}${s?' sub':''}'>${x[1]}</a>`;
let docs=[],assets=null,pjSel='',dash={},dmsg='',invF=[],rptF=[],LOCKED=true;
let rows=[],org="",db=null,cur=null;
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const val=v=>v==null||v===""?"Not stated":Array.isArray(v)?v.join("; "):v;
const num=v=>parseFloat(String(v??"").replace(/[^0-9.\-]/g,""));

const did=id=>String(id||"x").replace(/[^A-Za-z0-9_.\-]/g,"_");
const DEF="Director, Engineering Services | | \nManager, Capital Projects | | Director, Engineering Services\nSenior Engineering Technologist | | Manager, Capital Projects\nEngineering Technologist | | Senior Engineering Technologist\nProject Engineer | | Manager, Capital Projects\nInspector | | Project Engineer";

function status(r){const why=[];let s="g";
 const up=(c,m)=>{if(c){why.push(m);s=c==="r"?"r":(s==="r"?"r":"a")}};
 if(r.id_matches===false)up("r","Project ID mismatch");
 if((r.discrepancies||[]).length)up("r",(r.discrepancies.length)+" discrepancy(ies)");
 const p=r.prev;
 if(p){const a=num(p.budget_total),b=num(r.budget_total);if(a>0&&b>0&&Math.abs(b-a)/a>.1)up("r","Budget changed >10%");
  if(p.end_date&&r.end_date&&r.end_date>p.end_date)up("r","Completion date slipped")}
 if(!/approv/i.test(r.approval_status||"")||/not|pend|await/i.test(r.approval_status||""))up("a","Approval not confirmed");
 if((r.data_gaps||[]).length>2)up("a","Several data gaps");
 return{s,why}}
const dot=s=>`<span class="dot" style="background:var(--${s})" title="${{r:"Red",a:"Amber",g:"Green"}[s]}"></span>`;
function diffs(r){if(!r.prev)return[];return DIFF.filter(k=>String(r.prev[k]??"")!==String(r[k]??"")).map(k=>`${FM.find(f=>f[0]===k)[1]}: ${val(r.prev[k])} → ${val(r[k])}`)}

let KEY=null,CM=null,metaRes,LKM='setup';const metaP=new Promise(r=>metaRes=r);const RAW={projects:[],documents:[],dash:[],org:null};
const b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)},ub64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const pP=id=>'projects/p_'+hsh(String(id)),pD=id=>'documents/q_'+hsh(String(id)),pS=id=>'dash/x_'+hsh(String(id));
async function mkKey(pw,saltHex){const k=await crypto.subtle.importKey('raw',tenc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:unhx(saltHex),iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encK(k,o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,tenc.encode(JSON.stringify(o))));return{e:1,iv:b64(iv),ct:b64(ct)}}
async function decK(k,x){try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(x.iv)},k,ub64(x.ct))))}catch(e){return null}}
const encO=o=>encK(KEY,o),decO=async x=>!x?null:!x.e?x:(KEY?decK(KEY,x):null);
async function rebuild(){if(!KEY){rows=[];docs=[];dash={};return}
 rows=(await Promise.all(RAW.projects.map(decO))).filter(Boolean);docs=(await Promise.all(RAW.documents.map(decO))).filter(Boolean);
 dash={};(await Promise.all(RAW.dash.map(decO))).filter(x=>x&&x.pid).forEach(x=>{dash[x.pid]=x});
 if(RAW.org){const o=await decO(RAW.org);if(o&&o.text!=null)org=o.text}org=org||DEF2}
async function wr(col,path,obj){const enc=await encO(obj);
 if(db){try{await db.doc(path).set(enc)}catch(e){db=null}}
 enc._k=path;if(col==='org'){RAW.org=enc;if(!db)ls('es_raw_org',enc);return}
 const a=RAW[col],i=a.findIndex(x=>x._k===path);if(i>=0)a[i]=enc;else a.push(enc);if(!db)ls('es_raw_'+col,a)}
async function rm(col,path){if(db){try{await db.doc(path).delete()}catch(e){}}RAW[col]=RAW[col].filter(x=>x._k!==path);if(!db)ls('es_raw_'+col,RAW[col])}
async function migratePlain(){const old=p=>{if(db)return db.doc(p).delete().catch(()=>{})};
 for(const x of RAW.projects.filter(x=>x&&!x.e&&x.project_id)){await wr('projects',pP(x.project_id),x);await old('projects/'+did(x.project_id))}
 for(const x of RAW.documents.filter(x=>x&&!x.e&&x.id)){await wr('documents',pD(x.id),x);await old('documents/'+x.id)}
 for(const x of RAW.dash.filter(x=>x&&!x.e&&x.pid)){await wr('dash',pS(x.pid),x);await old('dash/'+did(x.pid))}
 if(RAW.org&&!RAW.org.e&&RAW.org.text!=null)await wr('org','meta/org',{text:RAW.org.text});
 if(!db){['projects','documents','dash'].forEach(c=>{RAW[c]=RAW[c].filter(x=>x&&x.e);ls('es_raw_'+c,RAW[c])});['es_rows','es_docs','es_dash','es_org2'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}})}
 await rebuild()}
async function load(){
 try{db=await claude.use("db")}catch(e){}
 try{assets=await claude.use("assets")}catch(e){}
 const re=()=>rebuild().then(()=>{if(!LOCKED){route(true);if(location.hash==='#projects'&&window.__pl)window.__pl()}});
 if(db){try{
  db.collection('projects').onSnapshot(s=>{RAW.projects=s.docs.map(d=>d.data()).filter(Boolean);re()},()=>{});
  db.collection('documents').onSnapshot(s=>{RAW.documents=s.docs.map(d=>d.data()).filter(Boolean);re()},()=>{});
  db.collection('dash').onSnapshot(s=>{RAW.dash=s.docs.map(d=>d.data()).filter(Boolean);re()},()=>{});
  db.doc('meta/org').onSnapshot(d=>{RAW.org=d.exists?d.data():null;re()},()=>{});
  db.doc('meta/crypto').onSnapshot(d=>{CM=d.exists?d.data():null;metaRes()},()=>metaRes());
 }catch(e){db=null}}

  if(!cat){const c=DOCCATS.find(c=>{const k=n2(c);return k===n||k===n.replace(/s$/,'')||k+'s'===n});if(c){cat=c;continue}}}
 const rest=segs.filter(sg=>{const n=n2(sg);return !rows.some(x=>n2(x.project_id)===n||(x.project_number&&n2(x.project_number)===n))&&!DOCCATS.some(c=>{const k=n2(c);return k===n||k===n.replace(/s$/,'')||k+'s'===n})});

- RFQ (s.5.3.2): for deliverables estimated at more than $50,000 and less than $100,000, when the requirement can be fully defined and the award is made on total cost that meets all specifications, terms and conditions.
- Invitational competition (s.5.3.1): more than $10,000 up to $50,000, written quotes from at least three suppliers.
- RFT or RFP (s.5.3.3): one of these must be used for any purchase over $100,000, and may be used for lower values where appropriate.
- RFT: used when the solutions, specifications, performance standards and timeframes are defined in the solicitation document; normally awarded to the compliant bidder with the lowest cost. An RFT is used only if ALL of these apply: two or more suppliers are capable of supplying; price is the only determining criterion; bids can be submitted on a common pricing basis; the intent is to accept the lowest priced compliant tender without negotiation. Otherwise another method approved by the Procurement Supervisor is used.
- RFP: the alternative to an RFT, normally for services, complex goods or construction; the bidder proposes a solution to the City requirements; the supplier is selected on overall Best Value as set out in the solicitation document.
- Negotiated Competitive Procurement (s.5.3.4): builds on the RFP process; the RFP must state that it will be used.
- SRFQ is NOT defined in this policy.
- Solicitation documents must include all material information, all evaluation criteria, and administrative matters such as dates and contacts (s.5.1).
- Opportunities over $50,000 are posted by open electronic tendering, normally at least 21 calendar days (s.5.7).
- Bid evaluation team has at least two staff (s.5.3.5).
- Council authorization is needed before procurements estimated at $500,000 or more (s.3.1.1). A bond is ordinarily required for construction contracts of $500,000 or more (s.6.4).
